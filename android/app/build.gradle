plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def casinhaBaseVersionCode = 3
def casinhaBaseVersionName = '2.0.1-native'
def casinhaVersionCode = providers.environmentVariable('CASINHA_VERSION_CODE')
    .orElse(providers.gradleProperty('CASINHA_VERSION_CODE'))
    .map { value ->
        def parsed = value.toInteger()
        if (parsed < casinhaBaseVersionCode || parsed > 2100000000) {
            throw new GradleException(
                "CASINHA_VERSION_CODE must be between ${casinhaBaseVersionCode} and 2100000000."
            )
        }
        parsed
    }
    .getOrElse(casinhaBaseVersionCode)
def casinhaVersionName = providers.environmentVariable('CASINHA_BUILD_LABEL')
    .orElse(providers.gradleProperty('CASINHA_BUILD_LABEL'))
    .map { label ->
        if (!(label ==~ /[A-Za-z0-9.-]+/)) {
            throw new GradleException('CASINHA_BUILD_LABEL may only contain letters, numbers, dots, and hyphens.')
        }
        "${casinhaBaseVersionName}.${label}"
    }
    .getOrElse(casinhaBaseVersionName)
def betaStoreFile = providers.environmentVariable('CASINHA_BETA_STORE_FILE').orNull
def betaStorePassword = providers.environmentVariable('CASINHA_BETA_STORE_PASSWORD').orNull
def betaKeyAlias = providers.environmentVariable('CASINHA_BETA_KEY_ALIAS').orNull
def betaKeyPassword = providers.environmentVariable('CASINHA_BETA_KEY_PASSWORD').orNull
def betaSigningValues = [betaStoreFile, betaStorePassword, betaKeyAlias, betaKeyPassword]
def betaSigningConfigured = betaSigningValues.every { value -> value != null && !value.isBlank() }

if (betaSigningValues.any { value -> value != null && !value.isBlank() } && !betaSigningConfigured) {
    throw new GradleException('Casinha beta signing must provide all four CASINHA_BETA_* environment variables.')
}

android {
    namespace 'com.findmucker.casa'
    compileSdk 36

    defaultConfig {
        applicationId 'com.findmucker.casa'
        minSdk 23
        targetSdk 36
        versionCode casinhaVersionCode
        versionName casinhaVersionName

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        if (betaSigningConfigured) {
            beta {
                storeFile file(betaStoreFile)
                storePassword betaStorePassword
                keyAlias betaKeyAlias
                keyPassword betaKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        beta {
            initWith release
            matchingFallbacks = ['release']
            debuggable false
            if (betaSigningConfigured) {
                signingConfig signingConfigs.beta
            }
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation platform('androidx.compose:compose-bom:2025.03.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'

    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'

    implementation platform('com.google.firebase:firebase-bom:34.0.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-messaging'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.03.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
