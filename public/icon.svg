<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce7f3"/>
      <stop offset="100%" style="stop-color:#f5d0fe"/>
    </linearGradient>
    <linearGradient id="roof" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f472b6"/>
      <stop offset="100%" style="stop-color:#e879f9"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <!-- House body -->
  <rect x="148" y="260" width="216" height="160" rx="16" fill="white" opacity="0.9"/>
  <!-- Roof -->
  <path d="M120 270 L256 150 L392 270" stroke="url(#roof)" stroke-width="28" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Door -->
  <rect x="228" y="320" width="56" height="100" rx="28" fill="#f9a8d4"/>
  <!-- Door knob -->
  <circle cx="270" cy="375" r="6" fill="#ec4899"/>
  <!-- Left window -->
  <rect x="170" y="290" width="42" height="42" rx="8" fill="#fce7f3" stroke="#f9a8d4" stroke-width="3"/>
  <line x1="191" y1="290" x2="191" y2="332" stroke="#f9a8d4" stroke-width="2"/>
  <line x1="170" y1="311" x2="212" y2="311" stroke="#f9a8d4" stroke-width="2"/>
  <!-- Right window -->
  <rect x="300" y="290" width="42" height="42" rx="8" fill="#fce7f3" stroke="#f9a8d4" stroke-width="3"/>
  <line x1="321" y1="290" x2="321" y2="332" stroke="#f9a8d4" stroke-width="2"/>
  <line x1="300" y1="311" x2="342" y2="311" stroke="#f9a8d4" stroke-width="2"/>
  <!-- Heart on roof -->
  <path d="M256 195 C256 185, 242 175, 236 185 C230 175, 216 185, 216 195 C216 210, 256 230, 256 230 C256 230, 296 210, 296 195 C296 185, 282 175, 276 185 C270 175, 256 185, 256 195Z" fill="#f472b6" opacity="0.9"/>
  <!-- Chimney -->
  <rect x="320" y="170" width="30" height="60" rx="4" fill="#fda4af"/>
  <!-- Smoke -->
  <circle cx="335" cy="155" r="8" fill="#fce7f3" opacity="0.7"/>
  <circle cx="345" cy="140" r="10" fill="#fce7f3" opacity="0.5"/>
  <circle cx="338" cy="122" r="12" fill="#fce7f3" opacity="0.3"/>
</svg>
