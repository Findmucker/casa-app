name: Android APK

on:
  workflow_dispatch:
    inputs:
      distribute:
        description: Send this master build to the private Firebase tester group
        required: true
        default: false
        type: boolean
  pull_request:
    branches: [master]
    paths:
      - "android/**"
      - "scripts/*android.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"
  push:
    branches: [master]
    paths:
      - "android/**"
      - "scripts/*android.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}-${{ (github.run_attempt > 1 || (github.event_name == 'workflow_dispatch' && !inputs.distribute)) && github.run_id || 'release' }}
  cancel-in-progress: ${{ github.run_attempt == 1 && (github.event_name != 'workflow_dispatch' || inputs.distribute) }}

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI artifacts stay above the checked-in base version. Tester releases use
      # their own higher range in the gated job below.
      ORG_GRADLE_PROJECT_CASINHA_BUILD_LABEL: test.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v6

      - name: Reserve CI version code
        shell: bash
        run: echo "ORG_GRADLE_PROJECT_CASINHA_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Verify Android configuration
        run: npm run android:verify

      - name: Test and lint native app
        run: npm run android:check

      - name: Build debug APK
        run: npm run android:build

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: casinha-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  tester-update:
    name: Send private tester update
    needs: debug-apk
    if: >-
      github.run_attempt == 1 &&
      github.repository_id == '1226468580' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.distribute)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: android-testers
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check private distribution configuration
        id: config
        shell: bash
        env:
          DISTRIBUTION_ENABLED: ${{ vars.ANDROID_DISTRIBUTION_ENABLED }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_TESTER_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_TESTER_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_TESTER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_TESTER_KEY_PASSWORD }}
        run: |
          if [[ "$DISTRIBUTION_ENABLED" != "true" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Firebase tester delivery is disabled; the verified APK build remains available as an artifact."
            exit 0
          fi

          configured=0
          [[ -n "$KEYSTORE_BASE64" ]] && configured=$((configured + 1))
          [[ -n "$STORE_PASSWORD" ]] && configured=$((configured + 1))
          [[ -n "$KEY_ALIAS" ]] && configured=$((configured + 1))
          [[ -n "$KEY_PASSWORD" ]] && configured=$((configured + 1))

          if [[ "$configured" -ne 4 ]]; then
            echo "Firebase tester delivery is only partially configured. Add every android-testers environment secret." >&2
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out source
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v6

      - name: Set up Node.js
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Set up Java
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        if: steps.config.outputs.configured == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        if: steps.config.outputs.configured == 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install pinned Firebase CLI
        if: steps.config.outputs.configured == 'true'
        run: npm ci --ignore-scripts --omit=optional

      - name: Prepare stable beta signing
        if: steps.config.outputs.configured == 'true'
        id: release
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_TESTER_KEYSTORE_BASE64 }}
        run: |
          version_code=$((100000 + GITHUB_RUN_NUMBER))
          if [[ "$version_code" -gt 2100000000 ]]; then
            echo "The Android tester version code exceeded the platform limit." >&2
            exit 1
          fi

          keystore="$RUNNER_TEMP/casinha-testers.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "version-code=$version_code" >> "$GITHUB_OUTPUT"
          echo "keystore=$keystore" >> "$GITHUB_OUTPUT"

      - name: Test, lint, and build signed beta APK
        if: steps.config.outputs.configured == 'true'
        env:
          CASINHA_VERSION_CODE: ${{ steps.release.outputs.version-code }}
          CASINHA_BUILD_LABEL: beta.${{ github.run_number }}
          CASINHA_BETA_STORE_FILE: ${{ steps.release.outputs.keystore }}
          CASINHA_BETA_STORE_PASSWORD: ${{ secrets.ANDROID_TESTER_STORE_PASSWORD }}
          CASINHA_BETA_KEY_ALIAS: ${{ secrets.ANDROID_TESTER_KEY_ALIAS }}
          CASINHA_BETA_KEY_PASSWORD: ${{ secrets.ANDROID_TESTER_KEY_PASSWORD }}
        run: node scripts/build-android.mjs testBetaUnitTest lintBeta assembleBeta

      - name: Verify package, version, build mode, and signer
        if: steps.config.outputs.configured == 'true'
        shell: bash
        env:
          EXPECTED_VERSION_CODE: ${{ steps.release.outputs.version-code }}
        run: |
          apk="android/app/build/outputs/apk/beta/app-beta.apk"
          aapt2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          expected_cert_sha256="$(< android/CASINHA_BETA_CERT_SHA256)"

          "$apksigner" verify --verbose --print-certs "$apk"
          badging="$("$aapt2" dump badging "$apk")"
          package_name="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$badging")"
          version_code="$(sed -n "s/^package: .*versionCode='\([^']*\)'.*/\1/p" <<< "$badging")"
          cert_sha256="$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          normalized_cert="$(tr -d ':[:space:]' <<< "$cert_sha256" | tr '[:lower:]' '[:upper:]')"
          normalized_expected="$(tr -d ':[:space:]' <<< "$expected_cert_sha256" | tr '[:lower:]' '[:upper:]')"

          [[ "$package_name" == "com.findmucker.casa" ]]
          [[ "$version_code" == "$EXPECTED_VERSION_CODE" ]]
          [[ "$normalized_cert" == "$normalized_expected" ]]
          if grep -q '^application-debuggable' <<< "$badging"; then
            echo "The tester APK must not be debuggable." >&2
            exit 1
          fi

      - name: Remove signing key from the runner
        if: steps.config.outputs.configured == 'true' && always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/casinha-testers.jks"

      - name: Authenticate to Firebase
        if: steps.config.outputs.configured == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/776757654663/locations/global/workloadIdentityPools/github-actions/providers/github-casa-app
          service_account: github-android-distribution@casa-66668.iam.gserviceaccount.com

      - name: Distribute APK to the private tester group
        if: steps.config.outputs.configured == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          release_notes="$RUNNER_TEMP/casinha-release-notes.txt"
          printf 'Casinha beta %s\nCommit: %.12s\n' \
            "${{ github.run_number }}" "$SOURCE_SHA" > "$release_notes"

          distribution_log="$RUNNER_TEMP/firebase-app-distribution.log"
          if npx --no-install firebase appdistribution:distribute \
            android/app/build/outputs/apk/beta/app-beta.apk \
            --project casa-66668 \
            --app 1:776757654663:android:723d4443cad6dd283ff422 \
            --groups casinha-testers \
            --release-notes-file "$release_notes" > "$distribution_log" 2>&1; then
            echo "Casinha beta was delivered to the private Firebase tester group."
          else
            sed -E 's#https?://[^[:space:]]+#<redacted-url>#g' "$distribution_log" >&2
            exit 1
          fi
