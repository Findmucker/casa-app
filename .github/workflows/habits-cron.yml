name: Habit Reminders Cron

on:
  schedule:
    # GitHub may delay scheduled jobs during busy periods. The API keeps a
    # three-hour recovery window and deduplicates each reminder in Firestore.
    - cron: "*/5 * * * *"
  workflow_dispatch: # Allow manual trigger for testing

concurrency:
  group: habit-reminders-cron
  cancel-in-progress: false

jobs:
  trigger-habits:
    runs-on: ubuntu-latest
    steps:
      - name: Call habit cron endpoint
        run: |
          set -euo pipefail
          body_file=$(mktemp)
          response=$(curl --silent --show-error --retry 2 --max-time 60 \
            --output "$body_file" --write-out "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/habits")
          body=$(cat "$body_file")
          echo "Response: $response"
          echo "Body: $body"
          if [ "$response" != "200" ]; then
            echo "::error::Cron endpoint returned $response"
            exit 1
          fi
          echo "$body" | jq -e '.ok == true' > /dev/null
