name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Tests
        run: npm test -- --passWithNoTests --coverage

      - name: Build
        run: npm run build

  pr-checks:
    name: PR Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR title follows Conventional Commits
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          if ! echo "$TITLE" | grep -qE '^(feat|fix|chore|docs|style|refactor|perf|test|i18n|ci)(\(.+\))?: .+'; then
            echo "❌ PR title must follow Conventional Commits format:"
            echo "   feat: description"
            echo "   fix(scope): description"
            echo ""
            echo "   Got: $TITLE"
            exit 1
          fi
          echo "✅ PR title is valid: $TITLE"

      - name: Check branch naming
        run: |
          BRANCH="${{ github.head_ref }}"
          if ! echo "$BRANCH" | grep -qE '^(codex|feature|fix|hotfix|refactor|test|chore|ci|i18n|docs)/'; then
            echo "⚠️  Branch name '$BRANCH' doesn't follow convention."
            echo "   Expected: codex/, feature/, fix/, hotfix/, refactor/, test/, chore/, ci/, i18n/, docs/"
            echo "   (This is a warning, not blocking)"
          else
            echo "✅ Branch name is valid: $BRANCH"
          fi

      - name: Comment build size on PR
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');

            // Get changed files count
            const files = execSync('git diff --name-only origin/${{ github.base_ref }}...HEAD').toString().trim().split('\n');
            const tsFiles = files.filter(f => f.match(/\.(tsx?|jsx?)$/));
            const styleFiles = files.filter(f => f.match(/\.(css|scss)$/));

            const body = [
              '## 📊 PR Stats',
              '',
              `| Metric | Value |`,
              `|--------|-------|`,
              `| Files changed | ${files.length} |`,
              `| Code files | ${tsFiles.length} |`,
              `| Style files | ${styleFiles.length} |`,
              '',
              '---',
              '🤖 *Auto-generated by CI*'
            ].join('\n');

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('📊 PR Stats'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  auto-label:
    name: Auto Label PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const labels = [];

            if (title.startsWith('feat')) labels.push('enhancement');
            if (title.startsWith('fix')) labels.push('bug');
            if (title.startsWith('docs')) labels.push('documentation');
            if (title.startsWith('chore')) labels.push('chore');
            if (title.startsWith('i18n')) labels.push('i18n');
            if (title.startsWith('refactor')) labels.push('refactor');

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels,
              });
            }
